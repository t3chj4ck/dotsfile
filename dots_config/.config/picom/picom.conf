backend = "glx";

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;

blur-background-exclude = [
	"class_g = 'slop'",
];


animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.8;
        duration = 0.2;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.8;
        duration = 0.2;
    }
);
