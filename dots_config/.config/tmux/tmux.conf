unbind C-b


set -g prefix `
setw -g mode-keys vi

bind ` send-prefix

#hotkey
bind n new-window
bind w kill-pane

bind v split-window -h
bind s split-window -v

bind c copy-mode
#mouse
set -g mouse on

#count from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g destroy-unattached on

