[theme]
theme = "srcery" 
[icons]
icons = "material-nf"


# [theme.overrides]
# idle_fg = "#ffffff"
# warning_fg = "#ffff00"
# critical_fg = "#ff0000"

[[block]]
block = "custom"
command = "~/script/get_window_name.sh"
interval = 1
[block.theme_overrides]
idle_bg = "#015778"

[[block]]
block = "custom"
command = "bash ~/script/weather.sh"
interval = "once"


[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = "$icon_swap $swap_used_percents.eng(w:2)"


[[block]]
block = "cpu"
interval = 10
format = " $icon $utilization "

[[block]]
block = "temperature"
interval = 10
format = " $icon $max"


[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "

[[block]]
block = "custom"
command = "bash ~/script/power_status.sh"
interval = 10


[[block]]
block = "backlight"
format = " $icon $brightness "


[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 10
format = " $timestamp.datetime(f:'%a %d/%m %R') "


[[block]]
block = "net"
device = "^(enp|ens|enx|eth|wlp|wlan)"
format = " $icon {$signal_strength $ssid} "
interval = 10

[[block]]
block = "custom"
command = "echo 󰸉"
interval = "once"
[[block.click]]
button = "left"
cmd = "bash ~/script/change_wallpaper.sh"
[[block.click]]
button = "right"
cmd = "bash ~/script/change_wallpaper_rightclick.sh"



