background {
    monitor =
    path = screenshot          # 设置为 screenshot，表示直接截取锁屏前一刻的桌面图片
    
    # 模糊相关配置
    blur_passes = 3            # 模糊轮数/强度（0 表示禁用模糊，数字越大越模糊，通常 2~3 就很丝滑了）
    blur_size = 8              # 模糊半径
    noise = 0.0117             # 增加一点噪点质感
    contrast = 0.8916          # 对比度
    brightness = 0.8172        # 亮度
    vibrancy = 0.1696          # 饱和度
}



input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true

    # 关键设置：关闭“为空时淡出隐藏”
    fade_on_empty = false   # 设为 false 后，即使没有输入内容，输入框也会永久显示

    # 另外确保没有把 timeout 设得极短（默认没有 fade_timeout 隐藏整个框的限制）
    # fade_timeout = 1000   # 如果写了这个属性，可以注释掉或删掉

    position = 0, -20
    halign = center
    valign = center
}
